name: 🧪 Tests & Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
    # 1️⃣ Récupérer le code
    - uses: actions/checkout@v3
    
    # 2️⃣ Installer Python
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    # 3️⃣ Installer les dépendances
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # 4️⃣ Lancer les tests unitaires
    - name: Run unit tests
      run: |
        pytest tests/test_unitaire_*.py -v
    
    # 5️⃣ Lancer les tests d'intégration
    - name: Run integration tests
      run: |
        pytest tests/test_integration_*.py -v
    
    # 6️⃣ Générer le rapport de couverture
    - name: Generate coverage report
      run: |
        pip install coverage
        coverage run -m pytest tests/ --cov=app
        coverage xml
        coverage report
    
    # 7️⃣ Uploader le rapport sur Codecov (optionnel)
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # ✨ Job pour vérifier la qualité du code
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint
    
    # 8️⃣ Vérifier la syntaxe
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true