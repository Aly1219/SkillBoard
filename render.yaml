services:
  - type: web
    name: skillboard
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    
    # Port
    ports:
      - port: 5000
        protocol: http
    
    # Variables d'environnement
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        value: your-super-secret-key-change-this-asap-12345
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: FLASK_PORT
        value: 5000
      - key: DATABASE_URL
        value: sqlite:////tmp/instance/skillboard.db
    
    # Sauvegarder les données
    volumes:
      - path: /tmp/instance
        name: skillboard-data